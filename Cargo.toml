[package]
name = "pre-commit-hooks"
version = "0.3.1"
edition = "2021"
authors = ["Joe Grund <grundjoseph@gmail.com>", "Seto Elkahfi <setoelkahfi@gmail.com>"]
build = "build.rs"
description = "Run cargo fmt, clippy or any command as a git pre-commit hook, configured in Cargo.toml. Works with Cargo workspaces."
license = "MIT"
repository = "https://github.com/smbcloudXYZ/pre-commit-hooks"
homepage = "https://smbcloud.xyz"
keywords = ["git", "pre-commit", "hooks", "cargo", "workspace"]
categories = ["development-tools", "development-tools::build-utils"]
readme = "README.md"

[package.metadata.precommit]
# Add your pre-commit configuration here.
# This section is needed when using this pre-commit-hooks.

[build-dependencies]
toml = "0.7"
